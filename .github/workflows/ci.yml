name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "audit/*"
      - "ci/*"
      - "edition/*"
      - "fix/*"
      - "feature/*"
      - "measure/*"
      - "policy/*"
      - "release/*"
      - "test/*"
  schedule:
    - cron: "17 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy --toolchain stable

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --locked --all-targets

      - name: Check Rust 2024 compatibility lints
        env:
          RUSTFLAGS: -D rust-2024-compatibility
        run: cargo check --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Measure fast corpus
        run: HDDL_CORPUS_SELECTION=fast HDDL_CORPUS_ASSERT=both cargo run --locked --example corpus_measure

      - name: Measure full corpus
        if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: HDDL_CORPUS_SELECTION=full HDDL_CORPUS_ASSERT=both cargo run --locked --example corpus_measure

      - name: Build release binaries
        run: cargo build --release --locked --bins

      - name: Smoke test hddl_analyzer
        run: ./target/release/hddl_analyzer --help
